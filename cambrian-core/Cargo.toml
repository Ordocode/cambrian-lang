[package]
name = "cambrian-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Core language types for Cambrian: U256, arithmetic, collections, casting"

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"
