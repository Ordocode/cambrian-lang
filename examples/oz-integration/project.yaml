name: oz-integration
target: evm
deterministic_addresses: true
output_dir: build/
sources:
  - PaymentForwarder.cam

# Phase Library-4: foundry.remappings makes `@openzeppelin/contracts/...`
# imports resolve against a checked-out OpenZeppelin clone. Pair with
# `forge install OpenZeppelin/openzeppelin-contracts` inside `build/`.
foundry:
  optimizer: true
  via_ir: true
  remappings:
    - "@openzeppelin/=lib/openzeppelin-contracts/"
    - "forge-std/=lib/forge-std/src/"
